<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <!-- 這行很重要：告訴手機瀏覽器要符合設備寬度，不要縮放比例 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LINE 訊息管理後台</title>
  <style>
    /* ================= 基本與桌機版樣式 ================= */
    body { 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
      background: #f4f7f6; 
      margin: 0; 
      padding: 20px; 
    }
    .container { 
      max-width: 800px; 
      margin: 0 auto; 
      background: white; 
      padding: 20px; 
      border-radius: 10px; 
      box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
    }
    h2 { 
      text-align: center; 
      color: #333; 
      margin-top: 5px;
    }
    .loading { 
      text-align: center; 
      color: #666; 
      padding: 20px 0;
    }

    /* 卡片設計 */
    .message-card { 
      border: 1px solid #ddd; 
      padding: 15px; 
      margin-bottom: 12px; 
      border-radius: 8px; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      transition: opacity 0.3s; 
      gap: 15px;
    }
    
    /* 內容區塊 */
    .content { 
      flex-grow: 1; 
      /* 防止過長的網址或連續字母撐破卡片 */
      word-wrap: break-word; 
      word-break: break-word;
    }
    .time { font-size: 0.85em; color: #888; white-space: pre-line; }
    .text { font-size: 1.15em; margin: 8px 0; font-weight: bold; color: #111; }
    .translation { color: #0056b3; font-size: 0.95em; }
    .translation a { color: #0056b3; text-decoration: none; font-weight: bold; }
    .translation a:hover { text-decoration: underline; }

    /* 按鈕設計 */
    .check-btn { 
      background: #28a745; 
      color: white; 
      border: none; 
      padding: 10px 18px; 
      border-radius: 5px; 
      cursor: pointer; 
      font-size: 1em; 
      flex-shrink: 0;
      transition: background 0.2s;
    }
    .check-btn:hover { background: #218838; }

    /* ================= 手機版專屬樣式 ================= */
    @media (max-width: 600px) {
      body { 
        padding: 10px; /* 縮小兩側留白，把空間還給內容 */
      }
      .container { 
        padding: 15px; 
      }
      .message-card { 
        flex-direction: column; /* 把排版從左右改成上下 */
        align-items: stretch;   /* 讓裡面的元素自動撐滿寬度 */
      }
      .check-btn { 
        width: 100%;            /* 按鈕變成 100% 寬度 */
        padding: 14px;          /* 增加按鈕高度，讓大拇指更好按 */
        font-size: 1.1em;       /* 按鈕字體稍微放大 */
        margin-top: 10px;       /* 和上方的文字拉開距離 */
        border-radius: 8px;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <h2>待處理訊息清單</h2>
  <div id="loading" class="loading">載入資料中，請稍候...</div>
  <div id="message-list"></div>
</div>

<script>
  // ================= 替換成你的 GAS 網頁應用程式網址 =================
  const API_URL = "https://script.google.com/macros/s/AKfycbywNj83P6FrKQBUOIJGZL6UB-847AmsA5EmZKm6aImTUfstIVgQvnXzrObFYeM7O97v/exec"; 
  // ================================================================

  // 1. 取得資料
  async function fetchData() {
    try {
      const response = await fetch(`${API_URL}?action=getData`);
      const data = await response.json();
      renderList(data);
    } catch (error) {
      document.getElementById('loading').innerText = "載入失敗，請檢查網址或網路狀態。";
    }
  }

  // 2. 渲染畫面
  function renderList(data) {
    const list = document.getElementById('message-list');
    const loading = document.getElementById('loading');
    list.innerHTML = "";
    loading.style.display = "none";

    if (data.length === 0) {
      list.innerHTML = "<p style='text-align:center; color:#888;'>目前沒有待處理的訊息！🎉</p>";
      return;
    }

    data.forEach(item => {
      const card = document.createElement('div');
      card.className = "message-card";
      card.id = `row-${item.row}`;
      
      // 處理試算表回傳的換行符號或圖片連結公式
      let translationHtml = item.translation;
      if(translationHtml.includes("HYPERLINK")) {
        // 簡單提取 HYPERLINK 裡的網址
        const match = translationHtml.match(/HYPERLINK\("([^"]+)"/);
        if(match) translationHtml = `<a href="${match[1]}" target="_blank">點此查看圖片</a>`;
      }

      card.innerHTML = `
        <div class="content">
          <div class="time">${item.time}</div>
          <div class="text">${item.message}</div>
          <div class="translation">${translationHtml}</div>
        </div>
        <button class="check-btn" onclick="checkRow(${item.row})">✔ 完成</button>
      `;
      list.appendChild(card);
    });
  }

  // 3. 打勾並隱藏
  async function checkRow(row) {
    // 網頁端先將該卡片淡出並變更文字，提升使用者體驗
    const card = document.getElementById(`row-${row}`);
    const btn = card.querySelector('.check-btn');
    card.style.opacity = "0.5";
    btn.innerText = "處理中...";
    btn.disabled = true; // 防止連續點擊

    try {
      // 呼叫 API 在試算表打勾
      await fetch(`${API_URL}?action=checkRow&row=${row}`);
      card.style.display = "none"; // 成功後直接隱藏
    } catch (error) {
      alert("更新失敗，請稍後再試。");
      card.style.opacity = "1";
      btn.innerText = "✔ 完成";
      btn.disabled = false;
    }
  }

  // 網頁載入時立刻抓資料
  fetchData();
</script>

</body>
</html>
