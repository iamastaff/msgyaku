<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>先生からのメッセージ</title>
  <!-- 引入 LINE LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    /* ================= 現代簡約美化風格 (進階版) ================= */
    
    /* 1. 基礎設定與背景 (新增漸層背景) */
    body { 
      font-family: 'Helvetica Neue', 'Segoe UI', Arial, sans-serif; 
      /* 清新的微漸層綠色背景，帶有現代質感 */
      background: linear-gradient(135deg, #d4f0d4 0%, #f0f4f2 100%);
      background-attachment: fixed; /* 讓背景固定，滑動時不跟著跑 */
      margin: 0; 
      padding: 20px; 
      color: #333;
      min-height: 100vh;
    }
    
    /* 2. 主容器 */
    .container { 
      max-width: 700px; 
      margin: 0 auto; 
      background: rgba(255, 255, 255, 0.95); /* 微微透明的毛玻璃質感 */
      backdrop-filter: blur(10px);
      padding: 25px 30px; 
      border-radius: 16px; 
      box-shadow: 0 10px 30px rgba(0,0,0,0.08); 
    }
    
    /* 3. 標題與提示 (新增 Flex 排版以對齊圖示) */
    h2 { 
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px; /* 圖示與文字的間距 */
      color: #1a1a1a; 
      margin-top: 0;
      margin-bottom: 25px;
      font-size: 1.5em;
      border-bottom: 2px solid #00B900; 
      padding-bottom: 15px;
    }
    
    /* 標題圖示的顏色設定 */
    h2 svg {
      color: #00B900;
      width: 28px;
      height: 28px;
    }

    .loading { text-align: center; color: #888; padding: 20px 0; font-size: 1.1em; }
    .hidden { display: none !important; }

    /* 4. 表單與註冊區 */
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; margin-bottom: 8px; font-weight: 600; color: #444; font-size: 0.95em; }
    .form-group input { 
      width: 100%; 
      padding: 14px; 
      border: 1px solid #d1d5db; 
      border-radius: 8px; 
      box-sizing: border-box; 
      font-size: 1em;
      transition: border-color 0.3s;
    }
    .form-group input:focus {
      outline: none;
      border-color: #00B900; 
      box-shadow: 0 0 0 3px rgba(0, 185, 0, 0.1);
    }
    .error-msg { color: #dc3545; text-align: center; margin-top: 12px; font-weight: bold; font-size: 0.9em; }

    /* 5. 訊息卡片設計 */
    .message-card { 
      border: 1px solid #e5e7eb; 
      padding: 18px; 
      margin-bottom: 16px; 
      border-radius: 12px; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      transition: all 0.3s ease; 
      gap: 15px;
      background: #ffffff;
    }
    .message-card:hover {
      box-shadow: 0 6px 16px rgba(0,0,0,0.06);
      transform: translateY(-2px); 
      border-color: #c3e6c3;
    }
    
    /* 6. 卡片內容文字 */
    .content { flex-grow: 1; word-wrap: break-word; word-break: break-word; }
    .time { 
      font-size: 0.85em; 
      color: #6b7280; 
      white-space: pre-line;
      margin-bottom: 6px;
    }
    .text { 
      font-size: 1.1em; 
      margin: 0 0 10px 0; 
      font-weight: 500; 
      color: #111827; 
      line-height: 1.5; 
    }
    .translation { font-size: 0.95em; }
    .translation a { color: #00B900; text-decoration: none; font-weight: 600; display: inline-block;}
    
    /* 7. 圖片與翻轉按鈕設計 */
    .img-container {
      position: relative;
      display: block;
      width: 60%; /* 💡 修改這裡：電腦版強制固定為卡片寬度的 60% */
      margin-top: 8px;
    }
    .img-preview { 
      width: 100%; /* 撐滿外層容器 (也就是 60%) */
      height: auto; /* 解除高度限制，讓圖片照比例自然顯示 */
      border-radius: 8px; 
      box-shadow: 0 2px 6px rgba(0,0,0,0.1); 
      object-fit: contain;
      transition: transform 0.3s ease, margin 0.3s ease; 
      display: block;
    }
    /* 旋轉按鈕樣式 */
    .rotate-btn {
      position: absolute;
      bottom: 8px; right: 8px;
      background: rgba(0, 0, 0, 0.6);
      color: white; border: none; border-radius: 50%;
      width: 36px; height: 36px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      transition: background 0.2s, transform 0.2s;
      z-index: 10;
    }
    .rotate-btn:hover { background: rgba(0, 0, 0, 0.8); transform: scale(1.1); }
    .rotate-btn svg { width: 20px; height: 20px; }
    /* 8. 按鈕共用與個別設計 */
    .primary-btn, .check-btn { 
      background: #00B900; 
      color: white; 
      border: none; 
      cursor: pointer; 
      font-weight: bold; 
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    
    /* 註冊按鈕 */
    .primary-btn { 
      width: 100%; 
      padding: 15px; 
      border-radius: 8px; 
      font-size: 1.1em; 
    }
    
    /* 既讀按鈕 */
    .check-btn { 
      padding: 12px 20px; 
      border-radius: 8px; 
      font-size: 0.95em; 
      flex-shrink: 0; 
      box-shadow: 0 2px 4px rgba(0, 185, 0, 0.2);
    }
    
    /* 按鈕互動效果 */
    .primary-btn:hover, .check-btn:hover { background: #009900; box-shadow: 0 4px 8px rgba(0, 185, 0, 0.3); }
    .primary-btn:active, .check-btn:active { transform: scale(0.97); }
    .check-btn:disabled { background: #9ca3af; box-shadow: none; cursor: not-allowed; transform: none; }

    /* 9. 手機版響應式設計 */
    @media (max-width: 600px) {
      body { padding: 10px; }
      .container { padding: 20px 15px; border-radius: 12px; }
      h2 { font-size: 1.3em; }
      .message-card { flex-direction: column; align-items: stretch; padding: 15px; }
      .check-btn { width: 100%; padding: 15px; font-size: 1.05em; margin-top: 12px; }
      
      /* 💡 新增這兩行：強制手機版的圖片與容器撐滿寬度，與按鈕等寬 */
      .img-container { display: block; width: 100%; }
      .img-preview { width: 100%; max-height: none; height: auto; }
    }
  </style>
</head>
<body>

<div class="container">
  <!-- 標題區域：新增了信件/通知的向量圖示 -->
  <h2 id="page-title">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
    </svg>
    先生からのメッセージ
  </h2>
  
  <!-- 狀態提示 -->
  <div id="status-msg" class="loading">システムを初期化しています...</div>

  <!-- 註冊區塊 -->
  <div id="register-section" class="hidden">
    <p style="text-align:center; color:#555;">初回ログインです。本人確認を行い、LINEアカウントを連携してください</p>
    <div class="form-group">
      <label>氏名</label>
      <input type="text" id="reg-name" placeholder="スプレッドシートに登録されている氏名を入力">
    </div>
    <div class="form-group">
      <label>電話番号</label>
      <input type="tel" id="reg-phone" placeholder="スプレッドシートに登録されている電話番号を入力">
    </div>
    <button class="primary-btn" onclick="submitRegister()">連携する</button>
    <div id="reg-error" class="error-msg"></div>
  </div>

  <!-- 主系統區塊 -->
  <div id="main-section" class="hidden">
    <div id="message-list"></div>
  </div>
</div>

<script>
  // ================= 設定區 =================
  const API_URL = "https://script.google.com/macros/s/AKfycbywNj83P6FrKQBUOIJGZL6UB-847AmsA5EmZKm6aImTUfstIVgQvnXzrObFYeM7O97v/exec"; 
  const LIFF_ID = "2011505303-Fyhhrowx"; 
  // ==========================================

  let currentLineId = "";

  // 1. 初始化 LIFF
  async function initLiff() {
    try {
      await liff.init({ liffId: LIFF_ID });
      if (!liff.isLoggedIn()) {
        liff.login(); 
      } else {
        const profile = await liff.getProfile();
        currentLineId = profile.userId;
        verifyUser();
      }
    } catch (err) {
      document.getElementById('status-msg').innerText = "LINEログインの初期化に失敗しました。";
    }
  }

  // 2. 驗證身分
  async function verifyUser() {
    document.getElementById('status-msg').innerText = "本人確認中...";
    try {
      const res = await fetch(`${API_URL}?action=verifyLogin&lineId=${currentLineId}`);
      const data = await res.json();
      
      document.getElementById('status-msg').classList.add('hidden');
      
      if (data.status === "registered") {
        document.getElementById('main-section').classList.remove('hidden');
        loadMessages();
      } else {
        document.getElementById('register-section').classList.remove('hidden');
      }
    } catch (err) {
      document.getElementById('status-msg').innerText = "確認処理中にエラーが発生しました。";
    }
  }

  // 3. 送出註冊資料
  async function submitRegister() {
    const name = document.getElementById('reg-name').value.trim();
    const phone = document.getElementById('reg-phone').value.trim();
    const errorDiv = document.getElementById('reg-error');

    if (!name || !phone) {
      errorDiv.innerText = "氏名と電話番号をすべて入力してください。";
      return;
    }
    
    errorDiv.innerText = "連携処理中です。お待ちください...";
    try {
      const res = await fetch(`${API_URL}?action=register&lineId=${currentLineId}&name=${encodeURIComponent(name)}&phone=${encodeURIComponent(phone)}`);
      const data = await res.json();
      
      if (data.status === "success") {
        document.getElementById('register-section').classList.add('hidden');
        document.getElementById('main-section').classList.remove('hidden');
        loadMessages();
      } else {
        errorDiv.innerText = data.message;
      }
    } catch (err) {
      errorDiv.innerText = "通信エラーが発生しました。後でもう一度お試しください。";
    }
  }

  // 4. 讀取未完成訊息
  async function loadMessages() {
    const list = document.getElementById('message-list');
    list.innerHTML = "<div class='loading'>データを読み込んでいます...</div>";
    
    try {
      const res = await fetch(`${API_URL}?action=getData&lineId=${currentLineId}&t=${new Date().getTime()}`);
      const data = await res.json();
      
      const unreadCount = data.length;
      updateTitleCount(unreadCount);

      renderList(data);
    } catch (err) {
      list.innerHTML = "<div class='error-msg'>読み込みに失敗しました。</div>";
    }
  }

  // 獨立出更新標題的函數，保留 SVG 圖示
  function updateTitleCount(count) {
    const titleElement = document.getElementById('page-title');
    titleElement.innerHTML = `
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
      </svg>
      先生からのメッセージ (未読: ${count}件)
    `;
  }

  // 5. 渲染訊息清單
  function renderList(data) {
    const list = document.getElementById('message-list');
    list.innerHTML = "";

    if (data.length === 0) {
      list.innerHTML = "<p style='text-align:center; color:#888;'>現在未処理のメッセージはありません！🎉</p>";
      return;
    }

    data.forEach(item => {
      const card = document.createElement('div');
      card.className = "message-card";
      card.id = `row-${item.row}`;
      
      let messageText = item.message;
      if (typeof messageText === 'object' || messageText === "[object Object]") {
        messageText = "【画像メッセージ】";
      }
      
      let translationHtml = item.translation;
      if(translationHtml.includes("HYPERLINK")) {
        const match = translationHtml.match(/HYPERLINK\("([^"]+)"/);
        if(match) {
          const originalUrl = match[1];
          let embedUrl = originalUrl;
          
          const fileIdMatch = originalUrl.match(/id=([a-zA-Z0-9_-]+)/);
          if (fileIdMatch && fileIdMatch[1]) {
            embedUrl = `https://drive.google.com/thumbnail?id=${fileIdMatch[1]}&sz=w800`;
          }

          // 💡 替換這裡：加入 img-container 結構與獨立的旋轉按鈕
          translationHtml = `
            <div class="img-container">
              <a href="${originalUrl}" target="_blank">
                <img id="img-${item.row}" src="${embedUrl}" class="img-preview" alt="アップロードされた画像" onerror="this.style.display='none';" data-angle="0">
              </a>
              <button class="rotate-btn" onclick="rotateImg('img-${item.row}', event)" title="回転">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                </svg>
              </button>
            </div>
          `;
        }
      }

      card.innerHTML = `
        <div class="content">
          <div class="time">${item.time}</div>
          <div class="text">${messageText}</div>
          <div class="translation">${translationHtml}</div>
        </div>
        <button class="check-btn" onclick="checkRow(${item.row})">✔ 既読する</button>
      `;
      list.appendChild(card);
    });
  }

  // 💡 翻轉圖片功能 (每次點擊旋轉 90 度，並自動縮放對齊寬度)
  function rotateImg(imgId, event) {
    event.preventDefault();   // 防止觸發 <a> 標籤開啟原圖網頁
    event.stopPropagation();
    
    const img = document.getElementById(imgId);
    if (!img) return;
    
    // 記住圖片最初始的寬高
    if (!img.hasAttribute('data-orig-width')) {
      img.setAttribute('data-orig-width', img.offsetWidth);
      img.setAttribute('data-orig-height', img.offsetHeight);
    }
    
    const origW = parseFloat(img.getAttribute('data-orig-width'));
    const origH = parseFloat(img.getAttribute('data-orig-height'));
    
    let currentAngle = parseInt(img.getAttribute('data-angle')) || 0;
    currentAngle = (currentAngle + 90) % 360;
    img.setAttribute('data-angle', currentAngle);
    
    // 💡 核心修正：當旋轉為直式時，計算縮放比例 (Scale)
    if (currentAngle === 90 || currentAngle === 270) {
      // 讓旋轉後的視覺寬度，強迫等於原本的 100% 寬度
      const scale = origW / origH; 
      
      // 同時套用旋轉與縮放
      img.style.transform = `rotate(${currentAngle}deg) scale(${scale})`;
      
      // 縮放後高度會跟著改變，計算新的視覺高度來撐開上下空間
      const newVisualHeight = origW * scale; 
      const diff = (newVisualHeight - origH) / 2;
      
      img.style.marginTop = `${diff}px`;
      img.style.marginBottom = `${diff}px`;
      
      // 寬度已經完美吻合，不需要左右邊距補償了
      img.style.marginLeft = "0px";
      img.style.marginRight = "0px";
    } else {
      // 轉回 0 或 180 度時，恢復原本比例 (scale: 1) 與留白
      img.style.transform = `rotate(${currentAngle}deg) scale(1)`;
      img.style.marginTop = "0px";
      img.style.marginBottom = "0px";
      img.style.marginLeft = "0px";
      img.style.marginRight = "0px";
    }
  }
  
  // 6. 點擊已讀處理
  async function checkRow(row) {
    const card = document.getElementById(`row-${row}`);
    const btn = card.querySelector('.check-btn');
    card.style.opacity = "0.5";
    btn.innerText = "処理中...";
    btn.disabled = true;

    try {
      await fetch(`${API_URL}?action=checkRow&row=${row}&lineId=${currentLineId}&t=${new Date().getTime()}`);
      card.style.display = "none";
      
      // 動態抓取目前的數字並減一，保留 SVG 圖示
      const titleElement = document.getElementById('page-title');
      const match = titleElement.innerText.match(/未読: (\d+)件/);
      if (match) {
          const newCount = Math.max(0, parseInt(match[1]) - 1);
          updateTitleCount(newCount);
      }
    } catch (err) {
      alert("更新に失敗しました。後でもう一度お試しください。");
      card.style.opacity = "1";
      btn.innerText = "✔ 既読する";
      btn.disabled = false;
    }
  }

  // 啟動系統
  initLiff();
</script>

</body>
</html>
